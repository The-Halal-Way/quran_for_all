name: quran_for_all
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  http: ^1.5.0
  audioplayers: ^6.5.0
  audio_session: ^0.1.21
  google_fonts: ^6.3.1
  avro_phonetic_textfield: ^1.0.2
  permission_handler: ^11.4.0
  flutter_tts: ^4.2.5
  flutter_screenutil: ^5.9.3
  lottie: ^3.3.3

  # compass
  flutter_compass: ^0.8.1
  
  # prayer_time
  geolocator: ^14.0.2
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  intl: ^0.20.2
  home_widget: ^0.9.2
  flutter_local_notifications: ^22.3.1
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  pdfx: ^2.11.0

# Android's upstream plugin starts TTS during engine registration. This small
# local patch keeps the same API and starts it on the first speech request.
dependency_overrides:
  flutter_tts:
    path: packages/flutter_tts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/learn_quran/letters/
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/images/prayer/
    - assets/images/prayer/female/
    - assets/images/prayer/tayammum/
    - assets/images/prayer/wudu/
    - assets/images/nurani_quran/
    - assets/images/books/
    - assets/json/
    - assets/json/hadith_integrity/
    - assets/json/quiz/general/beginner/
    - assets/json/quiz/general/beginner/bangla/
    - assets/json/quiz/general/beginner/english/
    - assets/json/quiz/general/intermediate/
    - assets/json/quiz/general/intermediate/bangla/
    - assets/json/quiz/general/intermediate/english/
    - assets/json/quiz/general/pro/
    - assets/json/quiz/general/pro/bangla/
    - assets/json/quiz/general/pro/english/
    - assets/json/quiz/islamically_educated/intermediate/
    - assets/json/quiz/islamically_educated/intermediate/bangla/
    - assets/json/quiz/islamically_educated/intermediate/english/

  # Registered families avoid runtime FontLoader calls and repeated relayouts.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Thin.ttf
          weight: 100
        - asset: assets/fonts/Sora-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Sora-Light.ttf
          weight: 300
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
